name: edify
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'


#--------------- PACKAGES ------------------#
dependencies:
  flutter:
    sdk: flutter

  # Utility Packages
  http: ^1.1.0
  intl: ^0.19.0
  logger: ^2.0.1
  url_launcher: ^6.1.12
  flutter_native_splash: ^2.3.1
  smooth_page_indicator: ^1.1.0
  
  stacked_services: ^1.5.1
  get_it: ^7.1.3
  stacked: ^3.4.3
  cached_network_image: ^3.0.0
  dio: ^5.7.0
  flutter_swiper_null_safety: ^1.0.2
  web_socket_channel: ^3.0.1



  # Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.2

  # State Management
  get: ^4.6.5
  get_storage: ^2.1.1

  # product platform_specific:
  carousel_slider: ^5.0.0
  readmore: ^3.0.0
  flutter_rating_bar: ^4.0.1
  lottie: ^3.1.2
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  http_parser: ^4.0.2
  video_compress: ^3.1.3
  dartz: ^0.10.1
  like_button: ^2.0.5

  video_player: ^2.9.2
  better_player: ^0.0.84

  timeago: ^3.7.0
  share_plus: ^10.1.2




flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#272727"
  android_12:
    image: assets/logos/t-store-splash-logo-black.png
    image_dark: assets/logos/t-store-splash-logo-black.png
  android: true
  ios: true
  web: false


  #--------------- ./ PACKAGES END ------------------#


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0


flutter:

  uses-material-design: true

  #--------------- LOCAL ASSETS ------------------#
  assets:
    - assets/logos/
    - assets/icons/brands/
    - assets/images/content/
    - assets/images/banners/
    - assets/icons/categories/
    - assets/images/animations/
    - assets/icons/payment_methods/
    - assets/images/on_boarding_images/


